<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HATO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>HATO</title>
<style>
  :root{
    --verde:#2f6b3a; --verde-osc:#235230; --verde-cl:#e4f0e6;
    --ambar:#b45309; --ambar-cl:#fdf0d9; --rojo:#b3261e; --rojo-cl:#fbe4e2;
    --tinta:#1b1b1b; --gris:#6a6a64; --linea:#dcdad0; --fondo:#f6f5f0; --blanco:#fff;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--fondo);color:var(--tinta);font:18px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  #app{max-width:640px;margin:0 auto;min-height:100vh}
  header.top{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  header.top .marca{font-weight:800;letter-spacing:.08em;font-size:20px}
  header.top .rancho{flex:1;min-width:0;font-size:15px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.top select{max-width:100%;font-size:15px;padding:6px;border-radius:8px;border:0}
  .chip-sync{border:0;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700;background:#fff;color:var(--verde-osc);white-space:nowrap}
  .chip-sync.warn{background:var(--ambar-cl);color:var(--ambar)}
  .chip-sync.mal{background:var(--rojo-cl);color:var(--rojo)}
  main{padding:14px}
  h1,h2{margin:6px 0 12px;line-height:1.15}
  h2{font-size:22px}
  .card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:2px solid var(--verde);background:var(--blanco);color:var(--verde-osc);border-radius:14px;font:inherit;font-weight:700;padding:10px 14px;margin:0 0 10px;text-align:center}
  .btn.primario{background:var(--verde);color:#fff}
  .btn.peligro{border-color:var(--rojo);color:var(--rojo)}
  .btn.chico{min-height:44px;font-size:16px;width:auto;display:inline-flex;margin:0 8px 0 0}
  .btn.sel{background:var(--verde);color:#fff}
  .btn:active{transform:scale(.99)}
  .btn[disabled]{opacity:.5}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid .btn{margin:0;flex-direction:column;min-height:84px}
  .grid .btn .ico{font-size:28px}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .tile b{font-size:30px;line-height:1}
  label{display:block;font-weight:700;margin:12px 0 6px}
  input[type=text],input[type=email],input[type=password],input[type=date],textarea,select.campo{width:100%;font:inherit;padding:14px;border:2px solid var(--linea);border-radius:12px;background:#fff}
  input:focus,textarea:focus{outline:3px solid #9cc7a3;border-color:var(--verde)}
  textarea{min-height:90px}
  .fila{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .estado{display:inline-block;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;background:var(--verde-cl);color:var(--verde-osc)}
  .estado.alerta{background:var(--ambar-cl);color:var(--ambar)}
  .estado.mal{background:var(--rojo-cl);color:var(--rojo)}
  .metricas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .metricas>div,.metricas>.metrica{background:var(--fondo);border-radius:10px;padding:8px 10px}
  .metricas>.metrica{border:2px solid var(--verde);text-align:left;font:inherit;color:inherit;display:block;width:100%}
  .metricas>.metrica .ver{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--verde-osc)}
  .metricas b{display:block;font-size:24px;line-height:1.1}
  .metricas span{font-size:13px;color:var(--gris)}
  .rojo{color:var(--rojo)}
  .estado.gris{background:#ececE6;color:#555}
  .suave{color:var(--gris);font-size:15px}
  .pie{color:var(--gris);font-size:14px;text-align:center;margin:18px 0 28px}
  .aviso{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:16px}
  .aviso.info{background:var(--verde-cl);color:var(--verde-osc)}
  .aviso.warn{background:var(--ambar-cl);color:var(--ambar)}
  .aviso.mal{background:var(--rojo-cl);color:var(--rojo)}
  .cuadros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cuadros.dos{grid-template-columns:repeat(2,1fr)}
  .cuadro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:78px;padding:8px 4px;background:var(--blanco);border:2px solid var(--linea);border-radius:14px;font:inherit;color:var(--tinta);text-align:center;overflow-wrap:anywhere}
  .cuadro b{font-size:24px;line-height:1.1}
  .cuadro.ancho b{font-size:17px}
  .cuadro small{font-size:12px;color:var(--gris)}
  .cuadro.alerta{border-color:#d98a1c;background:#fff6e6}
  .cuadro.alerta small{color:#9a5b00;font-weight:700}
  .cuadro.apagada{opacity:.55}
  .cuadro.dudosa{border-style:dashed}
  .cuadro.sel{border-color:var(--verde);background:var(--verde);color:#fff}
  .cuadro.sel small{color:#fff}
  .cuadro:active{transform:scale(.97)}
  @media (min-width:600px){.cuadros{grid-template-columns:repeat(4,1fr)}.cuadros.dos{grid-template-columns:repeat(3,1fr)}}
  .vaca{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:12px 14px;margin-bottom:10px;font:inherit;color:inherit}
  .vaca .arete{font-size:22px;font-weight:800}
  .ev{border-top:1px solid var(--linea);padding:10px 0}
  .ev:first-child{border-top:0}
  .ev.anulado{opacity:.5;text-decoration:line-through}
  .badge{font-size:13px;font-weight:700;border-radius:8px;padding:2px 7px}
  .badge.pend{background:var(--ambar-cl);color:var(--ambar)}
  .badge.err{background:var(--rojo-cl);color:var(--rojo)}
  .badge.ok{background:var(--verde-cl);color:var(--verde-osc)}
  .atras{background:none;border:0;color:var(--verde-osc);font:inherit;font-weight:700;padding:8px 0;margin-bottom:4px}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:#222;color:#fff;border-radius:12px;padding:14px;z-index:20;text-align:center}
</style>
</head>
<body>
<div id="app"><main><p class="suave">Cargando…</p></main></div>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
